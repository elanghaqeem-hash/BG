name: Temporary lockfile regeneration (BG hardening only)
on:
  push:
    branches:
      - 'hardening/vercel-sandbox-uat-20261030'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/vercel-sandbox-uat-20261030
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lock without executing dependency install scripts
        run: npm --prefix frontend install --package-lock-only --ignore-scripts --no-fund
      - name: Check and commit only the lockfile if changed
        run: |
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(lockfile): use patched glob for Cloudflare build"
          git push origin HEAD:hardening/vercel-sandbox-uat-20261030
